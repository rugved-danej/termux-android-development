name: "CI Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-vet:
    name: "Code Quality & Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Go 1.24"
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: "Check Go Formatting"
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go source files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: "Run Go Vet"
        run: |
          go vet ./...

  cross-compile:
    name: "Cross-Compile & Smoke Test"
    runs-on: ubuntu-latest
    needs: lint-and-vet
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            target: tadev-android-arm64
          - goos: linux
            goarch: arm
            target: tadev-android-arm
          - goos: linux
            goarch: amd64
            target: tadev-android-amd64
          - goos: linux
            goarch: 386
            target: tadev-android-386

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: "Compile (${{ matrix.target }})"
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -ldflags="-s -w -X 'main.Author=Rugved Danej' -X 'main.Version=ci-${{ github.sha }}'" -o build/${{ matrix.target }} main.go
          chmod +x build/${{ matrix.target }}
          ls -lh build/${{ matrix.target }}

      - name: "Smoke Test Native Execution (amd64 runner)"
        if: matrix.goarch == 'amd64'
        run: |
          build/${{ matrix.target }} version
          build/${{ matrix.target }} help
          PREFIX=/data/data/com.termux/files/usr build/${{ matrix.target }} config path
          PREFIX=/data/data/com.termux/files/usr build/${{ matrix.target }} config show
